<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Pro - Business Management</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div id="login-page" class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo"><i class="fas fa-chart-line"></i></div>
        <h1>ERP Pro</h1>
        <p>Business Management System</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <div class="input-icon"><i class="fas fa-user"></i><input type="text" id="login-username" placeholder="Enter username" required></div>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-icon"><i class="fas fa-lock"></i><input type="password" id="login-password" placeholder="Enter password" required></div>
        </div>
        <div id="login-error" class="error-msg" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      </form>
      <!-- 
      <div class="login-footer">
        <p>Demo: admin / admin123</p>
      </div>
      -->
    </div>
  </div>

  <div id="app" class="app-layout" style="display:none">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><i class="fas fa-chart-line"></i></div>
        <span class="sidebar-brand">ERP Pro</span>
        <button class="sidebar-toggle" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
        <a href="#" class="nav-item" data-page="clients"><i class="fas fa-users"></i><span>Clients</span></a>
        <a href="#" class="nav-item" data-page="products"><i class="fas fa-box"></i><span>Products</span></a>
        <a href="#" class="nav-item" data-page="orders"><i class="fas fa-shopping-cart"></i><span>Orders</span></a>
        <a href="#" class="nav-item" data-page="inventory"><i class="fas fa-warehouse"></i><span>Inventory</span></a>
        <a href="#" class="nav-item" data-page="sales"><i class="fas fa-dollar-sign"></i><span>Sales</span></a>
        <a href="#" class="nav-item" data-page="employees"><i class="fas fa-user-tie"></i><span>Employees</span></a>
        <a href="#" class="nav-item" data-page="users"><i class="fas fa-user-cog"></i><span>Users</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info" id="user-info">
          <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
          <div class="user-details">
            <span class="user-name" id="user-name"></span>
            <span class="user-role" id="user-role"></span>
          </div>
        </div>
        <button class="btn btn-logout" id="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </aside>

    <main class="main-content" id="main-content">
      <div id="impersonation-banner" class="impersonation-banner" style="display:none">
        <i class="fas fa-mask"></i>
        <span>Impersonating <strong id="impersonated-name"></strong></span>
        <button class="btn btn-sm btn-impersonate-exit" id="btn-exit-impersonation"><i class="fas fa-sign-out-alt"></i> Exit Impersonation</button>
      </div>
      <header class="top-bar">
        <button class="mobile-menu-btn" id="mobile-menu-btn"><i class="fas fa-bars"></i></button>
        <h2 id="page-title">Dashboard</h2>
        <div class="top-bar-right">
          <span id="current-date" class="current-date"></span>
          <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode"><i class="fas fa-moon"></i></button>
        </div>
      </header>
      <div class="content-area" id="content-area"></div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
